<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1013" />
    <title>Smart Dashboard</title>
    <script>
      // Applies the saved theme before the first paint so a reload does not flash the wrong one.
      // The key and values must match src/theme/useThemePreference.ts.
      try {
        const preference = localStorage.getItem('theme-preference');

        if (preference === 'light' || preference === 'dark') {
          document.documentElement.dataset.theme = preference;
        }
      } catch {
        // Storage can be unavailable; the system theme is fine.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
